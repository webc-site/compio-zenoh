[workspace]
resolver = "3"
members = ["cquic", "compio-zenoh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.lints.clippy]
# compio 线程每核 (thread-per-core) 模型：异步句柄绑定线程本地驱动，类型本身 !Send/!Sync，
# 在单运行时线程内以 Arc 共享句柄属预期用法，此 lint 对 compio 生态属误报
arc_with_non_send_sync = "allow"
